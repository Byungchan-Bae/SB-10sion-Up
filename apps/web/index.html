<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f9a23b" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 가장 많이 쓰는 굵기(900 · 800)만 미리 받는다. 지도 · 헤더 · 버튼이 이 둘을 쓴다.
         주소는 NanumHuman.css 안의 woff2 주소와 똑같아야 두 번 받지 않는다. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/gh/fonts-archive/NanumHuman/NanumHumanHeavy.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/gh/fonts-archive/NanumHuman/NanumHumanEB.woff2" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/NanumHuman/NanumHuman.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Jalnan/Jalnan.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- 아이콘: Figma "성북 트레저 마스코트 로고"(640:5475)에서 만듦 -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>성북 트레저</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
